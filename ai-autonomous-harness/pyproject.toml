[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-autonomous-harness"
version = "1.0.0"
description = "Production-grade, attachable Autonomous Multi-Agent SDLC/V-Model Execution Harness with 10-second atomic local persistence, 8-hour time budget, paper scraper, and multi-key failover."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "DeepMind & Advanced Agentic Engineering Team" }
]
dependencies = [
    "requests>=2.28.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0"
]

[project.scripts]
ai-harness = "ai_harness.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_harness*"]
