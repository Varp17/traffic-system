<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DevDominators — Live Detection Feed</title>
  <style>
    /* ── Reset & base ───────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0a0d14;
      --panel:     rgba(255,255,255,0.04);
      --border:    rgba(255,255,255,0.10);
      --accent:    #00e676;
      --ambulance: #ff1744;
      --stall:     #ff9100;
      --normal:    #00b0ff;
      --text:      #e0e0e0;
      --sub:       #888;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow-x: hidden;
    }

    /* ── Navbar ─────────────────────────────────────────────────────────── */
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1.5rem;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100;
    }
    .navbar .logo { font-size: 1.1rem; font-weight: 700; color: var(--accent); letter-spacing: 0.5px; }
    .navbar nav a {
      color: var(--text); text-decoration: none; margin-left: 1.2rem;
      padding: 0.3rem 0.75rem; border-radius: 6px; font-size: 0.9rem; transition: background 0.2s;
    }
    .navbar nav a:hover, .navbar nav a.active { background: rgba(255,255,255,0.12); }

    /* ── Status bar ─────────────────────────────────────────────────────── */
    .status-bar {
      display: flex; flex-wrap: wrap; gap: 0.6rem;
      padding: 0.6rem 1.5rem;
      background: rgba(0,0,0,0.35);
      border-bottom: 1px solid var(--border);
      font-size: 0.78rem; color: var(--sub);
    }
    .status-bar .pill {
      background: rgba(255,255,255,0.07);
      border: 1px solid var(--border);
      border-radius: 20px; padding: 0.2rem 0.75rem;
    }
    .status-bar .pill span { color: var(--accent); font-weight: 600; }
    #dot {
      display: inline-block; width: 8px; height: 8px;
      border-radius: 50%; background: #444; margin-right: 4px;
      transition: background 0.4s;
    }
    #dot.live { background: var(--accent); box-shadow: 0 0 6px var(--accent); animation: pulse 1.4s infinite; }
    @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:0.4 } }

    /* ── Main layout ─────────────────────────────────────────────────────── */
    .layout {
      display: grid;
      grid-template-columns: minmax(0,1fr) 380px;
      grid-template-rows: auto 1fr;
      gap: 0;
      height: calc(100vh - 88px);
    }

    /* ── Live stream panel ───────────────────────────────────────────────── */
    .stream-panel {
      grid-column: 1; grid-row: 1 / 3;
      display: flex; flex-direction: column;
      border-right: 1px solid var(--border);
      background: #000;
    }
    .stream-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.6rem 1rem;
      background: rgba(0,0,0,0.5);
      border-bottom: 1px solid var(--border);
      font-size: 0.82rem; font-weight: 600;
      flex-shrink: 0;
    }
    .stream-header .tag {
      background: rgba(0,230,118,0.15); color: var(--accent);
      border: 1px solid rgba(0,230,118,0.4); border-radius: 4px;
      padding: 0.15rem 0.5rem; font-size: 0.72rem;
    }
    #live-frame {
      flex: 1;
      width: 100%; height: 100%;
      object-fit: contain;
      display: block;
      background: #000;
    }

    /* ── Right sidebar ───────────────────────────────────────────────────── */
    .sidebar {
      grid-column: 2; grid-row: 1 / 3;
      display: flex; flex-direction: column;
      overflow: hidden;
    }

    /* ── Tabs ───────────────────────────────────────────────────────────── */
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .tab-btn {
      flex: 1; padding: 0.65rem; text-align: center;
      background: transparent; border: none; cursor: pointer;
      color: var(--sub); font-size: 0.82rem; font-weight: 600;
      border-bottom: 2px solid transparent; transition: all 0.2s;
    }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab-btn:hover { background: rgba(255,255,255,0.04); }

    /* ── Tab content ─────────────────────────────────────────────────────── */
    .tab-pane { display: none; flex: 1; flex-direction: column; overflow: hidden; }
    .tab-pane.active { display: flex; }

    .pane-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.5rem 0.75rem;
      font-size: 0.75rem; color: var(--sub);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .pane-header .count {
      background: rgba(255,255,255,0.08); border-radius: 10px;
      padding: 0.1rem 0.5rem; font-weight: 600; color: var(--text);
    }

    .crop-grid {
      flex: 1; overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px; padding: 8px;
      align-content: start;
    }
    /* scrollbar */
    .crop-grid::-webkit-scrollbar { width: 4px; }
    .crop-grid::-webkit-scrollbar-track { background: transparent; }
    .crop-grid::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }

    /* ── Crop card ───────────────────────────────────────────────────────── */
    .crop-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      transition: transform 0.15s, border-color 0.15s;
      cursor: default;
    }
    .crop-card:hover { transform: scale(1.03); border-color: rgba(255,255,255,0.25); }
    .crop-card.ambulance { border-color: rgba(255,23,68,0.6); }
    .crop-card.stall     { border-color: rgba(255,145,0,0.55); }

    .crop-card img {
      width: 100%; aspect-ratio: 4/3;
      object-fit: cover; display: block;
      background: #111;
    }
    .crop-meta {
      padding: 5px 7px;
      display: flex; flex-direction: column; gap: 2px;
    }
    .crop-label {
      font-size: 0.72rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .crop-label.car        { color: #00e676; }
    .crop-label.motorcycle { color: #ffab40; }
    .crop-label.bus        { color: #40c4ff; }
    .crop-label.truck      { color: #ce93d8; }
    .crop-label.bicycle    { color: #fff176; }
    .crop-label.person     { color: #80deea; }
    .crop-label.ambulance  { color: #ff1744; }
    .crop-label.default    { color: #bbb; }
    .crop-sub {
      font-size: 0.65rem; color: var(--sub);
      display: flex; gap: 6px;
    }
    .crop-sub .conf { color: #aaa; }
    .crop-sub .pcu  { color: #7c9cbf; }

    /* ── Incident card (wider) ───────────────────────────────────────────── */
    .incident-grid {
      flex: 1; overflow-y: auto;
      display: flex; flex-direction: column;
      gap: 8px; padding: 8px;
    }
    .incident-grid::-webkit-scrollbar { width: 4px; }
    .incident-grid::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }

    .incident-card {
      background: rgba(255,255,255,0.04);
      border-left: 3px solid var(--ambulance);
      border-radius: 6px;
      overflow: hidden;
      display: flex; flex-direction: column;
      transition: border-color 0.2s;
    }
    .incident-card.ambulance { border-left-color: var(--ambulance); }
    .incident-card.stall     { border-left-color: var(--stall); }
    .incident-card.accident  { border-left-color: #e040fb; }

    .incident-card img {
      width: 100%; max-height: 130px;
      object-fit: cover; display: block;
      background: #111;
    }
    .incident-info { padding: 7px 10px; }
    .incident-type {
      font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
      margin-bottom: 3px;
    }
    .incident-type.ambulance { color: var(--ambulance); }
    .incident-type.stall     { color: var(--stall); }
    .incident-type.accident  { color: #e040fb; }
    .incident-desc { font-size: 0.72rem; color: var(--sub); line-height: 1.4; }
    .incident-time { font-size: 0.65rem; color: #555; margin-top: 4px; }

    /* ── Empty state ─────────────────────────────────────────────────────── */
    .empty {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: var(--sub); font-size: 0.82rem; gap: 6px;
    }
    .empty .icon { font-size: 2rem; opacity: 0.3; }

    /* ── Responsive ──────────────────────────────────────────────────────── */
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; height: auto; }
      .stream-panel { height: 55vw; grid-row: 1; border-right: none; border-bottom: 1px solid var(--border); }
      .sidebar { grid-column: 1; grid-row: 2; height: 60vh; }
    }
  </style>
</head>
<body>

<!-- ── Navbar ──────────────────────────────────────────────────────────────── -->
<nav class="navbar">
  <span class="logo">🚦 DevDominators · Live Detection</span>
  <nav>
    <a href="index.html">Overview</a>
    <a href="detection_live.html" class="active">Live Detection</a>
  </nav>
</nav>

<!-- ── Status bar ─────────────────────────────────────────────────────────── -->
<div class="status-bar">
  <div class="pill"><span id="dot"></span><span id="status-text">Connecting…</span></div>
  <div class="pill">Vehicles: <span id="sb-vehicles">0</span></div>
  <div class="pill">PCU: <span id="sb-pcu">0.0</span></div>
  <div class="pill">FPS: <span id="sb-fps">0.0</span></div>
  <div class="pill">Detections: <span id="sb-dets">0</span></div>
  <div class="pill">Incidents: <span id="sb-inc">0</span></div>
  <div class="pill" id="sb-model-pill">Model: <span id="sb-model">–</span></div>
</div>

<!-- ── Main layout ─────────────────────────────────────────────────────────── -->
<div class="layout">

  <!-- Live stream -->
  <div class="stream-panel">
    <div class="stream-header">
      <span>📹 Live Annotated Feed</span>
      <span class="tag" id="stream-tag">YOLOv8 · REAL-TIME</span>
    </div>
    <!-- Polling JPEG from /api/frame every 150ms (≈6-7 FPS) -->
    <img id="live-frame" alt="Live detection feed" src="/api/frame"/>
  </div>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="tabs">
      <button class="tab-btn active" data-tab="vehicles">🚗 Vehicles</button>
      <button class="tab-btn"        data-tab="incidents">🚨 Incidents</button>
    </div>

    <!-- Vehicles tab -->
    <div class="tab-pane active" id="tab-vehicles">
      <div class="pane-header">
        <span>Cropped bounding-box captures</span>
        <span class="count" id="veh-count">0</span>
      </div>
      <div class="crop-grid" id="vehicle-grid">
        <div class="empty" style="grid-column:1/-1">
          <span class="icon">🔍</span>
          <span>Waiting for detections…</span>
        </div>
      </div>
    </div>

    <!-- Incidents tab -->
    <div class="tab-pane" id="tab-incidents">
      <div class="pane-header">
        <span>Ambulance / Stall / Accident crops</span>
        <span class="count" id="inc-count">0</span>
      </div>
      <div class="incident-grid" id="incident-grid">
        <div class="empty">
          <span class="icon">✅</span>
          <span>No incidents yet</span>
        </div>
      </div>
    </div>
  </div>

</div><!-- /.layout -->

<script>
  /* ── Tab switching ─────────────────────────────────────────────────────── */
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    });
  });

  /* ── Live JPEG stream: refresh <img> src every 150 ms ─────────────────── */
  const liveImg = document.getElementById('live-frame');
  let frameOk = false;

  function refreshFrame() {
    const ts = Date.now();
    const newSrc = '/api/frame?t=' + ts;
    const probe = new Image();
    probe.onload = () => {
      liveImg.src = newSrc;
      if (!frameOk) {
        frameOk = true;
        document.getElementById('dot').classList.add('live');
        document.getElementById('status-text').textContent = 'LIVE';
      }
    };
    probe.onerror = () => {
      if (frameOk) {
        frameOk = false;
        document.getElementById('dot').classList.remove('live');
        document.getElementById('status-text').textContent = 'Reconnecting…';
      }
    };
    probe.src = newSrc;
  }
  setInterval(refreshFrame, 150);   // ~6-7 FPS display


  /* ── Helpers ───────────────────────────────────────────────────────────── */
  function labelClass(raw) {
    const map = {
      car:'car', motorcycle:'motorcycle', bus:'bus', truck:'truck',
      bicycle:'bicycle', person:'person', ambulance:'ambulance'
    };
    return map[raw] || 'default';
  }

  function timeSince(ts) {
    const d = Math.floor(Date.now()/1000 - ts);
    if (d < 5)   return 'just now';
    if (d < 60)  return d + 's ago';
    if (d < 120) return '1 min ago';
    return Math.floor(d/60) + ' min ago';
  }

  /* ── Vehicle crop grid ─────────────────────────────────────────────────── */
  let prevDetIds = new Set();

  async function refreshDetections() {
    try {
      const r = await fetch('/api/detections');
      if (!r.ok) return;
      const data = await r.json();
      const dets = data.detections || [];

      document.getElementById('sb-dets').textContent = dets.length;
      document.getElementById('veh-count').textContent = dets.length;

      const grid = document.getElementById('vehicle-grid');

      // Only rebuild if IDs changed (avoids flicker on same frame)
      const newIds = dets.map(d => d.id).join(',');
      if (newIds === Array.from(prevDetIds).join(',')) return;
      prevDetIds = new Set(dets.map(d => d.id));

      if (dets.length === 0) {
        grid.innerHTML = `<div class="empty" style="grid-column:1/-1">
          <span class="icon">🔍</span><span>No detections yet</span></div>`;
        return;
      }

      grid.innerHTML = '';
      dets.forEach(det => {
        if (!det.crop_b64) return;
        const lc = labelClass(det.label_raw || det.label?.toLowerCase());
        const isAmb = det.is_ambulance;
        const card = document.createElement('div');
        card.className = 'crop-card' + (isAmb ? ' ambulance' : '');
        card.innerHTML = `
          <img src="data:image/jpeg;base64,${det.crop_b64}" alt="${det.label}" loading="lazy"/>
          <div class="crop-meta">
            <div class="crop-label ${lc}">${det.label}</div>
            <div class="crop-sub">
              <span class="conf">${Math.round(det.confidence*100)}%</span>
              ${det.pcu > 0 ? `<span class="pcu">${det.pcu} PCU</span>` : ''}
            </div>
          </div>`;
        grid.appendChild(card);
      });
    } catch (e) { /* ignore */ }
  }


  /* ── Incident grid ─────────────────────────────────────────────────────── */
  let prevIncIds = new Set();

  async function refreshIncidents() {
    try {
      const r = await fetch('/api/incidents');
      if (!r.ok) return;
      const data = await r.json();
      const incs = data.incidents || [];

      document.getElementById('sb-inc').textContent = incs.length;
      document.getElementById('inc-count').textContent = incs.length;

      const grid = document.getElementById('incident-grid');
      const newIds = incs.map(i => i.id).join(',');
      if (newIds === Array.from(prevIncIds).join(',')) return;
      prevIncIds = new Set(incs.map(i => i.id));

      if (incs.length === 0) {
        grid.innerHTML = `<div class="empty">
          <span class="icon">✅</span><span>No incidents yet</span></div>`;
        return;
      }

      grid.innerHTML = '';
      incs.forEach(inc => {
        const card = document.createElement('div');
        card.className = 'incident-card ' + (inc.type || 'ambulance');
        card.innerHTML = `
          ${inc.crop_b64
            ? `<img src="data:image/jpeg;base64,${inc.crop_b64}" alt="${inc.type}" loading="lazy"/>`
            : ''}
          <div class="incident-info">
            <div class="incident-type ${inc.type || ''}">${(inc.type||'INCIDENT').toUpperCase()} · ${inc.label||''}</div>
            <div class="incident-desc">${inc.description || ''}</div>
            <div class="incident-time">${inc.time_str || timeSince(inc.timestamp)}</div>
          </div>`;
        grid.appendChild(card);
      });
    } catch (e) { /* ignore */ }
  }


  /* ── Stats bar ─────────────────────────────────────────────────────────── */
  async function refreshStats() {
    try {
      const r = await fetch('/api/detection_stats');
      if (!r.ok) return;
      const d = await r.json();
      const counts = d.class_counts || {};
      const vTotal = Object.entries(counts)
        .filter(([k]) => !['person'].includes(k))
        .reduce((s,[,v]) => s+v, 0);

      document.getElementById('sb-vehicles').textContent = vTotal;
      document.getElementById('sb-pcu').textContent = (d.total_pcu || 0).toFixed(1);
      document.getElementById('sb-fps').textContent = (d.fps || 0).toFixed(1);
      document.getElementById('sb-model').textContent = d.model || '–';
    } catch (e) { /* ignore */ }
  }


  /* ── Poll intervals ─────────────────────────────────────────────────────── */
  refreshDetections();
  refreshIncidents();
  refreshStats();

  setInterval(refreshDetections, 500);   // crops refresh at 2 Hz
  setInterval(refreshIncidents,  1500);  // incidents refresh at 0.7 Hz
  setInterval(refreshStats,      1000);  // stats refresh at 1 Hz

  // Switch to incidents tab automatically on first incident
  let autoSwitched = false;
  setInterval(() => {
    if (!autoSwitched) {
      const count = parseInt(document.getElementById('inc-count').textContent || '0');
      if (count > 0) {
        autoSwitched = true;
        // Don't auto-switch — user may be looking at vehicles. Just badge the tab.
        const incBtn = document.querySelector('[data-tab="incidents"]');
        if (incBtn && !incBtn.classList.contains('active')) {
          incBtn.textContent = `🚨 Incidents (${count})`;
        }
      }
    }
  }, 2000);
</script>
</body>
</html>
